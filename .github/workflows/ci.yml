name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      # The sample pack is generated, not committed: the faults it contains are
      # defined in code, so the test asserts against something reproducible.
      - name: Generate the sample handover pack
        run: python samples/generate.py

      - name: Unit and end-to-end tests
        run: python -m pytest tests/ -q

      # Prints the report into the CI log, so the run itself is the evidence.
      - name: Gap report
        run: python -m handover.cli samples/pack
